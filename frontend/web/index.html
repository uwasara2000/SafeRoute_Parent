<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="parent_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>parent_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.SAFEROUTE_GOOGLE_MAPS_READY = false;

    function startFlutterApp() {
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    }

    function loadMapsThenFlutter() {
      const apiKey = window.SAFEROUTE_GOOGLE_MAPS_API_KEY;
      if (!apiKey || apiKey === 'YOUR_GOOGLE_MAPS_API_KEY') {
        startFlutterApp();
        return;
      }

      if (window.google && window.google.maps) {
        window.SAFEROUTE_GOOGLE_MAPS_READY = true;
        startFlutterApp();
        return;
      }

      const mapsScript = document.createElement('script');
      mapsScript.dataset.saferouteMaps = 'true';
      mapsScript.src =
        'https://maps.googleapis.com/maps/api/js?key=' +
        encodeURIComponent(apiKey);
      mapsScript.async = true;
      mapsScript.defer = true;
      mapsScript.onload = () => {
        window.SAFEROUTE_GOOGLE_MAPS_READY = Boolean(
          window.google && window.google.maps,
        );
        startFlutterApp();
      };
      mapsScript.onerror = startFlutterApp;
      document.head.appendChild(mapsScript);
    }

    const mapsConfig = document.createElement('script');
    mapsConfig.src = 'maps_config.js';
    mapsConfig.onload = loadMapsThenFlutter;
    mapsConfig.onerror = startFlutterApp;
    document.head.appendChild(mapsConfig);
  </script>
</body>
</html>
